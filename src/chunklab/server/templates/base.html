<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }} · chunklab</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">chunklab</a>
    <nav>
      <a href="/" class="{{ 'active' if active == 'documents' else '' }}">Documents &amp; Questions</a>
      <a href="/experiment" class="{{ 'active' if active == 'experiment' else '' }}">Experiment</a>
      <a href="/runs" class="{{ 'active' if active == 'runs' else '' }}">Runs</a>
    </nav>
  </header>
  <main>
    {% block content %}<p class="muted">Upload a document to get started.</p>{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
