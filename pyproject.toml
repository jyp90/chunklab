[project]
name = "chunklab"
version = "0.1.0"
description = "Benchmark your chunking before you ship it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "openai>=1.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.scripts]
chunklab = "chunklab.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunklab"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "ruff>=0.6", "ty"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/chunklab/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type Swig.*:DeprecationWarning", "ignore:builtin type swigvarlink.*:DeprecationWarning"]
