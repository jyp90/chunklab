[project]
name = "chunklab"
version = "0.1.0"
description = "Benchmark your chunking before you ship it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "jyp90" }]
keywords = ["rag", "chunking", "retrieval", "benchmark", "embeddings", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "openai>=1.40",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.urls]
Homepage = "https://github.com/jyp90/chunklab"
Repository = "https://github.com/jyp90/chunklab"
Issues = "https://github.com/jyp90/chunklab/issues"

[project.scripts]
chunklab = "chunklab.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunklab"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "ruff>=0.6", "ty", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/chunklab/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type Swig.*:DeprecationWarning", "ignore:builtin type swigvarlink.*:DeprecationWarning", "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning"]
